<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>RestoPro Ofitsant — sozlash</title>
<style>
  :root { --bg:#0B0B0C; --card:#18181B; --el:#222226; --border:rgba(255,255,255,.08); --text:#F4F4F2; --muted:#8A8A90; --brand:#FF3B2F; --ok:#22C55E; --err:#F87171; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 22px; }
  .field { margin-bottom:14px; } .field span { display:block; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
  input[type=text] { width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border); background:var(--el); color:var(--text); font-size:16px; }
  input:focus { outline:2px solid var(--brand); outline-offset:-1px; }
  label.chk { display:flex; gap:10px; align-items:center; color:var(--text); margin:6px 0 4px; cursor:pointer; }
  label.chk input { width:20px; height:20px; accent-color:var(--brand); }
  .row { display:flex; gap:10px; margin-top:18px; }
  button { flex:1; padding:14px; border-radius:12px; border:0; font-weight:700; font-size:15px; cursor:pointer; }
  .primary { background:var(--brand); color:#fff; }
  .ghost { background:var(--el); color:var(--text); border:1px solid var(--border); }
  button:disabled { opacity:.5; cursor:default; }
  .msg { padding:11px 13px; border-radius:11px; margin-top:14px; display:none; }
  .msg.ok { display:block; background:rgba(34,197,94,.10); color:var(--ok); border:1px solid rgba(34,197,94,.3); }
  .msg.err { display:block; background:rgba(239,68,68,.08); color:var(--err); border:1px solid rgba(239,68,68,.25); }
  .hint { color:var(--muted); font-size:13px; margin-top:6px; }
  .logo { width:44px; height:44px; border-radius:13px; background:var(--brand); display:grid; place-items:center; font-weight:800; font-size:20px; margin-bottom:16px; }
</style>
</head>
<body style="padding:30px">
  <div class="logo">R</div>
  <h1>RestoPro Ofitsant</h1>
  <p class="sub">Ofitsantlar monoblokini sozlash</p>

  <div class="field"><span>Server manzili</span>
    <input id="url" type="text" placeholder="http://192.168.1.10:5050" autocomplete="off" spellcheck="false">
    <div class="hint">Kassa kompyuterining manzili (kassa sozlash oynasida ko'rsatilgan) yoki restoran sayti, masalan https://cafe.example.uz</div>
  </div>
  <label class="chk"><input id="autostart" type="checkbox" checked> Kompyuter yoqilganda avtomatik ochilsin</label>

  <div id="msg" class="msg"></div>
  <div class="row">
    <button class="ghost" id="test">Tekshirish</button>
    <button class="primary" id="save">Saqlash va ochish</button>
  </div>

<script>
  const $ = id => document.getElementById(id)
  const show = (t, x) => { const el = $('msg'); el.className = 'msg ' + t; el.textContent = x }
  $('test').onclick = async () => {
    $('test').disabled = true; show('ok', 'Tekshirilmoqda...')
    const r = await window.terminal.test($('url').value)
    show(r.ok ? 'ok' : 'err', r.ok ? 'Server bilan ulanish ishlayapti' : r.message)
    $('test').disabled = false
  }
  $('save').onclick = async () => {
    if (!$('url').value.trim()) return show('err', 'Server manzilini kiriting')
    $('save').disabled = true; show('ok', 'Tekshirilmoqda...')
    const t = await window.terminal.test($('url').value)
    if (!t.ok) { show('err', t.message); $('save').disabled = false; return }
    await window.terminal.save({ url: $('url').value, autostart: $('autostart').checked })
  }
  ;(async () => {
    const s = await window.terminal.get()
    $('url').value = s.url || ''
    $('autostart').checked = s.autostart !== false
  })()
</script>
</body>
</html>
