# RestoPro — Windows ilovalari (Kassa + Ofitsant terminali)
#
# Har bir yig'ishga yangi versiya beriladi: 1.0.<run_number>.
#  - main branch'ga push (yoki qo'lda "Run workflow", yoki kassa-v* teg) →
#    GitHub Release yaratiladi. O'rnatilgan ilovalar uni 3 soat ichida o'zi
#    topadi, fonda yuklaydi va "Yangilash" taklif qiladi (electron-updater).
#  - boshqa branch'lar → faqat artefakt (sinash uchun), release yo'q.
name: Kassa (Windows)

on:
  workflow_dispatch:
  push:
    branches: ['main', 'claude/pensive-maxwell-gih8c6']
    tags: ['kassa-v*']
    paths: ['desktop/**', 'terminal/**', 'frontend/**', 'server/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  kassa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bog'liqliklar
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Versiya
        working-directory: desktop
        run: npm pkg set version=${{ env.VERSION }}

      - name: Installer yig'ish
        working-directory: desktop
        run: npm run prepare:win && npx electron-builder --win nsis --x64 --publish never

      - name: mongod tekshiruvi
        working-directory: desktop
        run: .\resources\mongodb\mongod.exe --version

      - name: Yangilanish fayllari bormi
        working-directory: desktop/dist
        shell: bash
        run: ls -la && test -f latest.yml && ls *.exe *.blockmap

      - uses: actions/upload-artifact@v4
        with:
          name: RestoPro-Kassa-Setup
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml

  # Ofitsantlar monobloki uchun terminal (PIN bilan kirish, chek printerga)
  terminal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bog'liqliklar
        working-directory: terminal
        run: npm ci --no-audit --no-fund

      - name: Versiya
        working-directory: terminal
        run: npm pkg set version=${{ env.VERSION }}

      - name: Installer yig'ish
        working-directory: terminal
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Yangilanish fayllari bormi
        working-directory: terminal/dist
        shell: bash
        run: ls -la && test -f terminal.yml && ls *.exe *.blockmap

      - uses: actions/upload-artifact@v4
        with:
          name: RestoPro-Ofitsant-Setup
          path: |
            terminal/dist/*.exe
            terminal/dist/*.blockmap
            terminal/dist/terminal.yml

  # Ikkala ilova bitta release'da: kassa latest.yml, terminal terminal.yml ni o'qiydi
  release:
    needs: [kassa, terminal]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/kassa-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - run: ls -la files

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: RestoPro ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          body: |
            Kassa va Ofitsant terminali ilovalari, versiya ${{ env.VERSION }}.
            O'rnatilgan ilovalar bu versiyani avtomatik topib yangilanadi.
            Yangi o'rnatish uchun: RestoPro-Kassa-Setup-${{ env.VERSION }}.exe / RestoPro-Ofitsant-Setup-${{ env.VERSION }}.exe
          files: files/*
