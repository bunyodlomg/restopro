# RestoPro — Windows ilovalari (Kassa + Ofitsant terminali)
#
# Har bir yig'ishga yangi versiya beriladi: 1.0.<run_number>.
#  - main branch'ga push (yoki qo'lda "Run workflow", yoki kassa-v* teg) →
#    .exe lar sotuvchining LITSENZIYA SERVERIGA yuklanadi. O'rnatilgan ilovalar
#    uni 3 soat ichida o'zi topadi, fonda yuklaydi va "Yangilash" taklif qiladi.
#    Yuklab olish faqat amaldagi litsenziyasi bor restoranlarga ruxsat etiladi.
#  - boshqa branch'lar → faqat artefakt (sinash uchun).
#
# Kerakli GitHub sirlari (Settings → Secrets and variables → Actions):
#   LICENSE_SERVER_URL   — masalan https://license.sizning-domen.uz
#   UPDATE_UPLOAD_TOKEN  — litsenziya serveri .env dagi UPDATE_UPLOAD_TOKEN bilan bir xil
name: Kassa (Windows)

on:
  workflow_dispatch:
  push:
    branches: ['main', 'claude/pensive-maxwell-gih8c6']
    tags: ['kassa-v*']
    paths: ['desktop/**', 'terminal/**', 'frontend/**', 'server/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  kassa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bog'liqliklar
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Versiya
        working-directory: desktop
        run: npm pkg set version=${{ env.VERSION }}

      - name: Installer yig'ish
        working-directory: desktop
        run: npm run prepare:win && npx electron-builder --win nsis --x64 --publish never

      - name: mongod tekshiruvi
        working-directory: desktop
        run: .\resources\mongodb\mongod.exe --version

      - name: Yangilanish fayllari bormi
        working-directory: desktop/dist
        shell: bash
        run: ls -la && test -f latest.yml && ls *.exe *.blockmap

      - uses: actions/upload-artifact@v4
        with:
          name: RestoPro-Kassa-Setup
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml

  # Ofitsantlar monobloki uchun terminal (PIN bilan kirish, chek printerga)
  terminal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bog'liqliklar
        working-directory: terminal
        run: npm ci --no-audit --no-fund

      - name: Versiya
        working-directory: terminal
        run: npm pkg set version=${{ env.VERSION }}

      - name: Installer yig'ish
        working-directory: terminal
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Yangilanish fayllari bormi
        working-directory: terminal/dist
        shell: bash
        run: ls -la && test -f terminal.yml && ls *.exe *.blockmap

      - uses: actions/upload-artifact@v4
        with:
          name: RestoPro-Ofitsant-Setup
          path: |
            terminal/dist/*.exe
            terminal/dist/*.blockmap
            terminal/dist/terminal.yml

  # Yangi versiyani litsenziya serveriga yuklash: avval .exe/.blockmap, oxirida .yml
  publish:
    needs: [kassa, terminal]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/kassa-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
      UPDATE_UPLOAD_TOKEN: ${{ secrets.UPDATE_UPLOAD_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Litsenziya serveriga yuklash
        shell: bash
        run: |
          set -euo pipefail
          ls -la files
          if [ -z "$LICENSE_SERVER_URL" ] || [ -z "$UPDATE_UPLOAD_TOKEN" ]; then
            echo "::warning::LICENSE_SERVER_URL / UPDATE_UPLOAD_TOKEN sirlari yo'q — yangilanish yuklanmadi (artefaktlar mavjud)"
            exit 0
          fi
          up() {
            name="$(basename "$1")"
            echo "→ $name"
            curl -fsS --retry 3 --retry-delay 5 -X PUT -T "$1" \
              -H "Authorization: Bearer $UPDATE_UPLOAD_TOKEN" -H "Content-Type: application/octet-stream" \
              "$LICENSE_SERVER_URL/api/v1/updates/$name"
            echo
          }
          for f in files/*.exe files/*.blockmap; do up "$f"; done
          for f in files/*.yml; do up "$f"; done
          echo "Yuklandi: versiya ${{ env.VERSION }}"
