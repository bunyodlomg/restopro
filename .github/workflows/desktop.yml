# RestoPro Kassa — Windows installer (.exe) yig'ish
# Ishga tushirish: GitHub → Actions → "Kassa (Windows)" → Run workflow,
# yoki teg qo'yish:  git tag kassa-v1.0.0 && git push origin kassa-v1.0.0
name: Kassa (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['kassa-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bog'liqliklar
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Installer yig'ish
        working-directory: desktop
        run: npm run dist:win

      - name: mongod tekshiruvi
        working-directory: desktop
        run: .\resources\mongodb\mongod.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: RestoPro-Kassa-Setup
          path: desktop/dist/*.exe

      - name: Release'ga qo'shish (teg bo'lsa)
        if: startsWith(github.ref, 'refs/tags/kassa-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
